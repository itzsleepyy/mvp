services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mvp
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: mvp
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mvp-postgres:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://mvp:mvp@postgres:5432/mvp
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: 30
      LOG_LEVEL: info
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  website:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    environment:
      MVP_API_URL: http://backend:3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mvp-postgres:
