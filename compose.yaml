services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mvp
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: mvp
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mvp-postgres:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://mvp:mvp@postgres:5432/mvp
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: 30
      LOG_LEVEL: info
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mvp-postgres:
