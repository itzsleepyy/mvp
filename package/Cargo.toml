[package]
name = "mvp"
version = "0.1.0"
edition = "2024"
description = "MVP: Most Valued Programmer, a competitive terminal arcade for the time between prompts"
license = "MIT"
repository = "https://github.com/itzsleepyy/waitstate"
readme = "../README.md"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
fs2 = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
open = "5.3.2"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
