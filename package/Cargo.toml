[package]
name = "mvp"
version = "0.1.0"
edition = "2024"
description = "MVP: Most Valued Programmer, a competitive terminal arcade for the time between prompts"
license = "MIT"
repository = "https://github.com/itzsleepyy/waitstate"
readme = "../README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
